seed: 42
image_size: 224
batch_size: 32
epochs: 25
learning_rate: 0.0003
weight_decay: 0.0001
num_workers: 2
patience: 6
val_fraction: 0.15
test_fraction: 0.15
model_name: efficientnet
ensemble_size: 5
freeze_epochs: 3
backbone_lr_scale: 0.1
data:
  root: data/SCUT-FBP5500_v2
  images_dir: data/SCUT-FBP5500_v2/Images
  labels_file: data/SCUT-FBP5500_v2/train_test_files/All_labels.txt
  processed_manifest: data/manifest.csv
  crops_dir: data/processed_faces
face_detector:
  backend: mtcnn
  cascade: haarcascade_frontalface_default.xml
  margin: 0.12
  align: true

